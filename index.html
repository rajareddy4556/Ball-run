<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>100 Planet Subway Runner</title>  <style>  
body{  
    margin:0;  
    overflow:hidden;  
    background:black;  
    font-family:Arial;  
}  
  
canvas{  
    display:block;  
}  
  
#score{  
    position:absolute;  
    top:10px;  
    left:10px;  
    color:white;  
    font-size:28px;  
    z-index:10;  
}  
  
#theme{  
    position:absolute;  
    top:50px;  
    left:10px;  
    color:cyan;  
    font-size:22px;  
    z-index:10;  
}  
  
#gameOver{  
    position:absolute;  
    top:40%;  
    width:100%;  
    text-align:center;  
    color:white;  
    font-size:60px;  
    display:none;  
    z-index:10;  
}  
  
button{  
    padding:15px 30px;  
    font-size:24px;  
    border:none;  
    border-radius:10px;  
    background:orange;  
    color:white;  
}  
</style>  </head>  <body>  <div id="score">Score: 0</div>  
<div id="theme">🪐 Planet 1</div>  <div id="gameOver">  
GAME OVER<br><br>  
<button onclick="location.reload()">Restart</button>  
</div>  <script type="module">  
  
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";  
  
//////////////////////////////////////////////////////  
// SCENE  
//////////////////////////////////////////////////////  
  
const scene = new THREE.Scene();  
  
scene.background = new THREE.Color(0x000814);  
  
scene.fog = new THREE.Fog(  
0x000814,  
20,  
180  
);  
  
//////////////////////////////////////////////////////  
// CAMERA  
//////////////////////////////////////////////////////  
  
const camera = new THREE.PerspectiveCamera(  
75,  
window.innerWidth/window.innerHeight,  
0.1,  
1000  
);  
  
camera.position.set(0,4,10);  
  
//////////////////////////////////////////////////////  
// RENDERER  
//////////////////////////////////////////////////////  
  
const renderer = new THREE.WebGLRenderer({  
antialias:true  
});  
  
renderer.setSize(  
window.innerWidth,  
window.innerHeight  
);  
  
renderer.shadowMap.enabled = true;  
  
document.body.appendChild(renderer.domElement);  
  
//////////////////////////////////////////////////////  
// LIGHTS  
//////////////////////////////////////////////////////  
  
const hemi = new THREE.HemisphereLight(  
0xffffff,  
0x444444,  
2  
);  
  
scene.add(hemi);  
  
const dir = new THREE.DirectionalLight(  
0xffffff,  
2  
);  
  
dir.position.set(5,10,7);  
  
scene.add(dir);  
  
//////////////////////////////////////////////////////  
// ROAD  
//////////////////////////////////////////////////////  
  
const road = new THREE.Mesh(  
  
new THREE.BoxGeometry(12,1,500),  
  
new THREE.MeshStandardMaterial({  
color:0x222222  
})  
);  
  
road.position.z = -220;  
  
scene.add(road);  
  
//////////////////////////////////////////////////////  
// TRACK LINES  
//////////////////////////////////////////////////////  
  
for(let i=0;i<150;i++){  
  
const line1 = new THREE.Mesh(  
  
new THREE.BoxGeometry(0.2,0.05,2),  
  
new THREE.MeshBasicMaterial({  
color:0xffffff  
})  
);  
  
line1.position.set(  
-2,  
0.6,  
-i*4  
);  
  
scene.add(line1);  
  
const line2 = line1.clone();  
  
line2.position.x = 2;  
  
scene.add(line2);  
}  
  
//////////////////////////////////////////////////////  
// STARS  
//////////////////////////////////////////////////////  
  
const starGeo =  
new THREE.BufferGeometry();  
  
const starArray = [];  
  
for(let i=0;i<6000;i++){  
  
starArray.push(  
Math.random()*800 - 400,  
Math.random()*300,  
Math.random()*800 - 400  
);  
}  
  
starGeo.setAttribute(  
'position',  
new THREE.Float32BufferAttribute(  
starArray,  
3  
)  
);  
  
const starMat =  
new THREE.PointsMaterial({  
color:0xffffff,  
size:0.4  
});  
  
const stars =  
new THREE.Points(  
starGeo,  
starMat  
);  
  
scene.add(stars);  
  
//////////////////////////////////////////////////////  
// RAIN  
//////////////////////////////////////////////////////  
  
const rainGeo =  
new THREE.BufferGeometry();  
  
const rainArray = [];  
  
for(let i=0;i<3000;i++){  
  
rainArray.push(  
Math.random()*200 - 100,  
Math.random()*100,  
Math.random()*200 - 100  
);  
}  
  
rainGeo.setAttribute(  
'position',  
new THREE.Float32BufferAttribute(  
rainArray,  
3  
)  
);  
  
const rainMat =  
new THREE.PointsMaterial({  
color:0xaaccff,  
size:0.15  
});  
  
const rain =  
new THREE.Points(  
rainGeo,  
rainMat  
);  
  
scene.add(rain);  
  
//////////////////////////////////////////////////////  
// PLAYER  
//////////////////////////////////////////////////////  
  
const player = new THREE.Group();  
  
const body = new THREE.Mesh(  
  
new THREE.BoxGeometry(1,1.5,1),  
  
new THREE.MeshStandardMaterial({  
color:0xff5500  
})  
);  
  
player.add(body);  
  
const head = new THREE.Mesh(  
  
new THREE.SphereGeometry(  
0.4,  
32,  
32  
),  
  
new THREE.MeshStandardMaterial({  
color:0xffcc99  
})  
);  
  
head.position.y = 1.2;  
  
player.add(head);  
  
player.position.set(0,1,5);  
  
scene.add(player);  
  
//////////////////////////////////////////////////////  
// VARIABLES  
//////////////////////////////////////////////////////  
  
const lanes = [-4,0,4];  
  
let currentLane = 1;  
  
let velocityY = 0;  
  
let isJumping = false;  
  
let speed = 0.8;  
  
let score = 0;  
  
let gameRunning = true;  
  
let currentTheme = -1;  
  
//////////////////////////////////////////////////////  
// PLANETS  
//////////////////////////////////////////////////////  
  
const planetNames = [];  
  
for(let i=1;i<=100;i++){  
  
planetNames.push(  
"Planet " + i  
);  
}  
  
const worldObjects = [];  
  
function clearWorld(){  
  
for(let i=0;i<worldObjects.length;i++){  
  
scene.remove(worldObjects[i]);  
}  
  
worldObjects.length = 0;  
}  
  
//////////////////////////////////////////////////////  
// CREATE PLANET  
//////////////////////////////////////////////////////  
  
function createPlanet(index){  
  
clearWorld();  
  
const hue =  
(index * 37) % 360;  
  
scene.background =  
new THREE.Color(  
`hsl(${hue},70%,12%)`  
);  
  
scene.fog.color.set(  
`hsl(${hue},70%,12%)`  
);  
  
road.material.color.set(  
`hsl(${(hue+40)%360},70%,30%)`  
);  
  
rain.material.color.set(  
`hsl(${(hue+80)%360},100%,70%)`  
);  
  
document.getElementById(  
"theme"  
).innerHTML =  
`🪐 ${planetNames[index]}`;  
  
//////////////////////////////////////////////////////  
// RANDOM STYLE  
//////////////////////////////////////////////////////  
  
const style = index % 10;  
  
//////////////////////////////////////////////////////  
// CITY  
//////////////////////////////////////////////////////  
  
if(style === 0){  
  
for(let i=0;i<120;i++){  
  
const h = 5 + Math.random()*40;  
  
const b = new THREE.Mesh(  
  
new THREE.BoxGeometry(6,h,6),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},60%,40%)`  
),  
emissive:new THREE.Color(  
`hsl(${hue},100%,10%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -14 : 14;  
  
b.position.set(  
side,  
h/2,  
-i*8  
);  
  
scene.add(b);  
  
worldObjects.push(b);  
}  
}  
  
//////////////////////////////////////////////////////  
// ROCKS  
//////////////////////////////////////////////////////  
  
if(style === 1){  
  
for(let i=0;i<150;i++){  
  
const rock = new THREE.Mesh(  
  
new THREE.DodecahedronGeometry(  
1 + Math.random()*4  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},80%,40%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -15 : 15;  
  
rock.position.set(  
side,  
Math.random()*5,  
-i*7  
);  
  
scene.add(rock);  
  
worldObjects.push(rock);  
}  
}  
  
//////////////////////////////////////////////////////  
// CRYSTALS  
//////////////////////////////////////////////////////  
  
if(style === 2){  
  
for(let i=0;i<120;i++){  
  
const crystal = new THREE.Mesh(  
  
new THREE.ConeGeometry(  
1,  
6,  
6  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},100%,70%)`  
),  
emissive:new THREE.Color(  
`hsl(${hue},100%,30%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -15 : 15;  
  
crystal.position.set(  
side,  
3,  
-i*8  
);  
  
scene.add(crystal);  
  
worldObjects.push(crystal);  
}  
}  
  
//////////////////////////////////////////////////////  
// TREES  
//////////////////////////////////////////////////////  
  
if(style === 3){  
  
for(let i=0;i<100;i++){  
  
const tree =  
new THREE.Group();  
  
const trunk =  
new THREE.Mesh(  
  
new THREE.CylinderGeometry(  
0.5,  
0.8,  
5  
),  
  
new THREE.MeshStandardMaterial({  
color:0x5c3b1e  
})  
);  
  
tree.add(trunk);  
  
const top =  
new THREE.Mesh(  
  
new THREE.SphereGeometry(  
2.5,  
16,  
16  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},80%,40%)`  
)  
})  
);  
  
top.position.y = 4;  
  
tree.add(top);  
  
const side =  
Math.random()>0.5 ? -14 : 14;  
  
tree.position.set(  
side,  
2,  
-i*8  
);  
  
scene.add(tree);  
  
worldObjects.push(tree);  
}  
}  
  
//////////////////////////////////////////////////////  
// NEON  
//////////////////////////////////////////////////////  
  
if(style === 4){  
  
for(let i=0;i<120;i++){  
  
const tower =  
new THREE.Mesh(  
  
new THREE.BoxGeometry(  
4,  
10 + Math.random()*30,  
4  
),  
  
new THREE.MeshStandardMaterial({  
color:0x111111,  
emissive:new THREE.Color(  
`hsl(${hue},100%,50%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -15 : 15;  
  
tower.position.set(  
side,  
10,  
-i*8  
);  
  
scene.add(tower);  
  
worldObjects.push(tower);  
}  
}  
  
//////////////////////////////////////////////////////  
// ORBS  
//////////////////////////////////////////////////////  
  
if(style === 5){  
  
for(let i=0;i<120;i++){  
  
const orb =  
new THREE.Mesh(  
  
new THREE.SphereGeometry(  
1 + Math.random()*2,  
16,  
16  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},100%,60%)`  
),  
emissive:new THREE.Color(  
`hsl(${hue},100%,30%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -14 : 14;  
  
orb.position.set(  
side,  
2 + Math.random()*5,  
-i*8  
);  
  
scene.add(orb);  
  
worldObjects.push(orb);  
}  
}  
  
//////////////////////////////////////////////////////  
// SPIKES  
//////////////////////////////////////////////////////  
  
if(style === 6){  
  
for(let i=0;i<140;i++){  
  
const spike =  
new THREE.Mesh(  
  
new THREE.ConeGeometry(  
1 + Math.random()*2,  
8 + Math.random()*8,  
5  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},80%,50%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -15 : 15;  
  
spike.position.set(  
side,  
4,  
-i*7  
);  
  
scene.add(spike);  
  
worldObjects.push(spike);  
}  
}  
  
//////////////////////////////////////////////////////  
// PILLARS  
//////////////////////////////////////////////////////  
  
if(style === 7){  
  
for(let i=0;i<120;i++){  
  
const pillar =  
new THREE.Mesh(  
  
new THREE.CylinderGeometry(  
1,  
1,  
12 + Math.random()*10,  
12  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},60%,50%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -14 : 14;  
  
pillar.position.set(  
side,  
6,  
-i*8  
);  
  
scene.add(pillar);  
  
worldObjects.push(pillar);  
}  
}  
  
//////////////////////////////////////////////////////  
// RANDOM OBJECTS  
//////////////////////////////////////////////////////  
  
if(style >= 8){  
  
for(let i=0;i<150;i++){  
  
const geo = [  
  
new THREE.BoxGeometry(3,3,3),  
  
new THREE.SphereGeometry(2),  
  
new THREE.ConeGeometry(2,6,6),  
  
new THREE.DodecahedronGeometry(2)  
  
];  
  
const obj =  
new THREE.Mesh(  
  
geo[  
Math.floor(Math.random()*geo.length)  
],  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
`hsl(${hue},80%,50%)`  
),  
emissive:new THREE.Color(  
`hsl(${hue},80%,20%)`  
)  
})  
);  
  
const side =  
Math.random()>0.5 ? -15 : 15;  
  
obj.position.set(  
side,  
2 + Math.random()*6,  
-i*7  
);  
  
scene.add(obj);  
  
worldObjects.push(obj);  
}  
}  
}  
  
//////////////////////////////////////////////////////  
// START PLANET  
//////////////////////////////////////////////////////  
  
createPlanet(0);  
  
//////////////////////////////////////////////////////  
// TRAINS  
//////////////////////////////////////////////////////  
  
const obstacles = [];  
  
function createObstacle(){  
  
const train =  
new THREE.Mesh(  
  
new THREE.BoxGeometry(  
2.5,  
3,  
8  
),  
  
new THREE.MeshStandardMaterial({  
color:new THREE.Color(  
Math.random(),  
Math.random(),  
Math.random()  
)  
})  
);  
  
const lane =  
Math.floor(Math.random()*3);  
  
train.position.set(  
lanes[lane],  
2,  
-120  
);  
  
scene.add(train);  
  
obstacles.push(train);  
}  
  
setInterval(()=>{  
  
if(gameRunning){  
  
createObstacle();  
}  
  
},1000);  
  
//////////////////////////////////////////////////////  
// COINS  
//////////////////////////////////////////////////////  
  
const coins = [];  
  
function createCoin(){  
  
const coin =  
new THREE.Mesh(  
  
new THREE.TorusGeometry(  
0.4,  
0.15,  
16,  
100  
),  
  
new THREE.MeshStandardMaterial({  
color:0xffd700,  
emissive:0xaa8800  
})  
);  
  
coin.rotation.x = Math.PI/2;  
  
const lane =  
Math.floor(Math.random()*3);  
  
coin.position.set(  
lanes[lane],  
1.5,  
-120  
);  
  
scene.add(coin);  
  
coins.push(coin);  
}  
  
setInterval(()=>{  
  
if(gameRunning){  
  
createCoin();  
}  
  
},600);  
  
//////////////////////////////////////////////////////  
// CONTROLS  
//////////////////////////////////////////////////////  
  
document.addEventListener(  
"keydown",  
(e)=>{  
  
if(e.key==="ArrowLeft"){  
  
currentLane--;  
  
if(currentLane<0)  
currentLane=0;  
}  
  
if(e.key==="ArrowRight"){  
  
currentLane++;  
  
if(currentLane>2)  
currentLane=2;  
}  
  
if(e.key==="ArrowUp"){  
  
if(!isJumping){  
  
velocityY = 0.28;  
  
isJumping = true;  
}  
}  
});  
  
//////////////////////////////////////////////////////  
// TOUCH  
//////////////////////////////////////////////////////  
  
window.addEventListener(  
"touchstart",  
(e)=>{  
  
const x =  
e.touches[0].clientX;  
  
if(x < innerWidth/3){  
  
currentLane--;  
  
if(currentLane<0)  
currentLane=0;  
}  
  
else if(x > innerWidth*2/3){  
  
currentLane++;  
  
if(currentLane>2)  
currentLane=2;  
}  
  
else{  
  
if(!isJumping){  
  
velocityY = 0.28;  
  
isJumping = true;  
}  
}  
});  
  
//////////////////////////////////////////////////////  
// GAME OVER  
//////////////////////////////////////////////////////  
  
function gameOver(){  
  
gameRunning = false;  
  
document.getElementById(  
"gameOver"  
).style.display = "block";  
}  
  
//////////////////////////////////////////////////////  
// ANIMATE  
//////////////////////////////////////////////////////  
  
function animate(){  
  
requestAnimationFrame(animate);  
  
if(!gameRunning) return;  
  
//////////////////////////////////////////////////////  
// PLAYER MOVE  
//////////////////////////////////////////////////////  
  
player.position.x +=  
(lanes[currentLane]  
- player.position.x)*0.2;  
  
//////////////////////////////////////////////////////  
// JUMP  
//////////////////////////////////////////////////////  
  
player.position.y += velocityY;  
  
velocityY -= 0.015;  
  
if(player.position.y <=1){  
  
player.position.y = 1;  
  
velocityY = 0;  
  
isJumping = false;  
}  
  
//////////////////////////////////////////////////////  
// TRAINS  
//////////////////////////////////////////////////////  
  
for(let i=0;i<obstacles.length;i++){  
  
const o = obstacles[i];  
  
o.position.z += speed;  
  
if(o.position.z >20){  
  
scene.remove(o);  
  
obstacles.splice(i,1);  
  
i--;  
  
continue;  
}  
  
const dx =  
Math.abs(  
player.position.x  
- o.position.x  
);  
  
const dz =  
Math.abs(  
player.position.z  
- o.position.z  
);  
  
if(dx <1.5 && dz <4){  
  
gameOver();  
}  
}  
  
//////////////////////////////////////////////////////  
// COINS  
//////////////////////////////////////////////////////  
  
for(let i=0;i<coins.length;i++){  
  
const c = coins[i];  
  
c.rotation.z += 0.1;  
  
c.position.z += speed;  
  
if(c.position.z >15){  
  
scene.remove(c);  
  
coins.splice(i,1);  
  
i--;  
  
continue;  
}  
  
const dx =  
Math.abs(  
player.position.x  
- c.position.x  
);  
  
const dz =  
Math.abs(  
player.position.z  
- c.position.z  
);  
  
if(dx <1 && dz <1){  
  
score += 10;  
  
document.getElementById(  
"score"  
).innerHTML =  
"Score: " + score;  
  
scene.remove(c);  
  
coins.splice(i,1);  
  
i--;  
}  
}  
  
//////////////////////////////////////////////////////  
// PLANET CHANGE EVERY 20 SCORE  
//////////////////////////////////////////////////////  
  
const planetIndex =  
Math.min(  
Math.floor(score / 20),  
99  
);  
  
if(currentTheme !== planetIndex){  
  
currentTheme = planetIndex;  
  
createPlanet(planetIndex);  
}  
  
//////////////////////////////////////////////////////  
// RAIN  
//////////////////////////////////////////////////////  
  
const rainPos =  
rain.geometry.attributes.position.array;  
  
for(let i=1;i<rainPos.length;i+=3){  
  
rainPos[i] -= 1.2;  
  
if(rainPos[i] <0){  
  
rainPos[i] = 100;  
}  
}  
  
rain.geometry.attributes.position.needsUpdate = true;  
  
//////////////////////////////////////////////////////  
// SPEED  
//////////////////////////////////////////////////////  
  
speed += 0.00005;  
  
//////////////////////////////////////////////////////  
// CAMERA  
//////////////////////////////////////////////////////  
  
camera.position.x +=  
(player.position.x  
- camera.position.x)*0.05;  
  
camera.lookAt(  
player.position.x,  
1,  
-20  
);  
  
renderer.render(  
scene,  
camera  
);  
}  
  
animate();  
  
//////////////////////////////////////////////////////  
// RESIZE  
//////////////////////////////////////////////////////  
  
window.addEventListener(  
"resize",  
()=>{  
  
camera.aspect =  
window.innerWidth/  
window.innerHeight;  
  
camera.updateProjectionMatrix();  
  
renderer.setSize(  
window.innerWidth,  
window.innerHeight  
);  
});  
  
</script>  </body>  
</html>
